<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Result</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="result-container">

    <div class="result-card">

        <h1>Test Result</h1>

        <p id="resultStudent"></p>
        <p id="resultDifficulty"></p>

        <div class="score-circle">
            <span id="score">0</span>
            <small>/ 20</small>
        </div>

        <h2 id="performance"></h2>

        <div class="stats">

            <div>
                <h3 id="total"></h3>
                <p>Total</p>
            </div>

            <div>
                <h3 id="correct"></h3>
                <p>Correct</p>
            </div>

            <div>
                <h3 id="wrong"></h3>
                <p>Wrong</p>
            </div>

            <div>
                <h3 id="unanswered"></h3>
                <p>Unanswered</p>
            </div>

        </div>

        <div class="accuracy">
            <h3>Accuracy</h3>
            <div class="accuracy-bar">
                <div id="accuracyBar"></div>
            </div>
            <p id="accuracyText"></p>
        </div>

    </div>

    <div class="analysis-card">

        <h2>Wrong Answer Analysis</h2>

        <div id="wrongAnswers"></div>

    </div>

    <div class="result-buttons">

        <button class="btn"
                onclick="retakeTest()">
            Retake Test
        </button>

        <button class="secondary-btn"
                onclick="newStudent()">
            New Student
        </button>

    </div>

</div>

<script src="script.js"></script><footer>
    Developed and Designed by Smita Parate
</footer>
</body>
</html>
